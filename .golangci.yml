version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  exclusions:
    rules:
      # Test helpers deliberately send requests to the URLs tests give them.
      - path: ^tests/
        linters: [gosec]
        text: "G704"

formatters:
  enable:
    - gofmt
    - goimports
