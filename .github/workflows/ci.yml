name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/faultbox

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases (decisions.md D6).
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests (race)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=unit.out ./tests/unit/...
      - name: Integration tests (race)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=integration.out ./tests/integration/...
      - name: Feature tests (race)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=feature.out ./tests/feature/...
      # Catches tests placed next to the code (needed for unexported helpers).
      - name: Package tests (race)
        run: go test -race -count=1 ./internal/... ./cmd/...
      - name: Coverage summary
        run: |
          go tool cover -func=unit.out | tail -1 | sed 's/^/unit:        /'
          go tool cover -func=integration.out | tail -1 | sed 's/^/integration: /'
          go tool cover -func=feature.out | tail -1 | sed 's/^/feature:     /'

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/faultbox ./cmd/faultbox

  image:
    name: Docker image
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Pull requests build and check the image but never push it.
      - name: Build for checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: faultbox:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image (non-root, migrations, health, persistence, memory)
        run: |
          set -eu
          user=$(docker image inspect faultbox:ci --format '{{.Config.User}}')
          echo "Image user: $user"
          case "$user" in ""|root|0|0:0) echo "Image must not run as root"; exit 1;; esac
          docker image ls faultbox:ci --format 'Image size: {{.Size}}'

          start() {
            docker run -d --name fb -p 8080:8080 --memory 128m --cpus 0.5 \
              -v fb-data:/data \
              -e FAULTBOX_SECRET="ci-secret-$(printf '%040d' 0)" \
              -e FAULTBOX_ADMIN_EMAIL=ci@example.com \
              -e FAULTBOX_ADMIN_PASSWORD=ci-password-123 \
              faultbox:ci >/dev/null
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8080/ready >/dev/null 2>&1 && return 0
              sleep 1
            done
            docker logs fb; exit 1
          }

          # Fresh container: migrations run, probes answer.
          start
          curl -fsS http://127.0.0.1:8080/health; echo
          curl -fsS http://127.0.0.1:8080/ready; echo
          docker exec fb /usr/local/bin/faultbox healthcheck
          docker logs fb 2>&1 | grep -q '"created bootstrap admin user"'

          sleep 5
          echo "Idle memory: $(docker stats --no-stream --format '{{.MemUsage}}' fb)" | tee -a "$GITHUB_STEP_SUMMARY"

          # Restart on the same volume: data persists, admin is not recreated.
          docker rm -f fb >/dev/null
          start
          if docker logs fb 2>&1 | grep -q '"created bootstrap admin user"'; then
            echo "Admin was recreated: data did not persist"; exit 1
          fi
          echo "Data persisted across restart"
          docker rm -f fb >/dev/null
          docker volume rm fb-data >/dev/null

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
