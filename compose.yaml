# Faultbox Compose deployment; configure values in .env.

services:
  faultbox:
    image: ghcr.io/sylvesteragyiri/faultbox:edge
    container_name: faultbox
    restart: unless-stopped
    ports:
      - "${FAULTBOX_HOST_PORT:-8080}:8080"
    environment:
      # App and storage
      FAULTBOX_SECRET: ${FAULTBOX_SECRET:?set FAULTBOX_SECRET (at least 32 bytes), e.g. openssl rand -base64 48}
      FAULTBOX_PORT: "8080"
      FAULTBOX_DATABASE_PATH: /data/faultbox.db

      # Dashboard admin (first user only)
      FAULTBOX_ADMIN_EMAIL: ${FAULTBOX_ADMIN_EMAIL:-}
      FAULTBOX_ADMIN_PASSWORD: ${FAULTBOX_ADMIN_PASSWORD:-}

      # Public URL and proxy
      FAULTBOX_PUBLIC_URL: ${FAULTBOX_PUBLIC_URL:-http://localhost:8080}
      FAULTBOX_TRUST_PROXY: ${FAULTBOX_TRUST_PROXY:-false}

      # Login protection (set both keys)
      FAULTBOX_TURNSTILE_SITE_KEY: ${FAULTBOX_TURNSTILE_SITE_KEY:-}
      FAULTBOX_TURNSTILE_SECRET_KEY: ${FAULTBOX_TURNSTILE_SECRET_KEY:-}

      # Limits and logging
      FAULTBOX_RETENTION_DAYS: ${FAULTBOX_RETENTION_DAYS:-30}
      FAULTBOX_LOG_LEVEL: ${FAULTBOX_LOG_LEVEL:-info}
    volumes:
      - faultbox-data:/data

    # Resource limits match the default Go memory limit.
    mem_limit: 128m
    cpus: 0.5
    networks:
      - faultbox

volumes:
  faultbox-data:
    name: faultbox-data

networks:
  faultbox:
    name: faultbox
